<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Abdurrahman Muhammad Bello — Frontend Developer</title>
    <meta
      name="description"
      content="Portfolio of Abdurrahman Muhammad Bello, a frontend developer and final-year Computer Science student specializing in React, TypeScript, and Tailwind CSS."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var initialTheme = stored === "light" || stored === "dark" ? stored : (prefersDark ? "dark" : "light");
          document.documentElement.classList.toggle("dark", initialTheme === "dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="font-body antialiased bg-[var(--color-bg)] text-[var(--color-text)]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
