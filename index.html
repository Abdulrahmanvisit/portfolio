<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Abdurrahman Muhammad Bello — Frontend Developer</title>
    <meta
      name="description"
      content="Portfolio of Abdurrahman Muhammad Bello, a frontend developer and final-year Computer Science student specializing in React, TypeScript, and Tailwind CSS."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      try {
        var stored = localStorage.getItem("theme");
        var system = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        if (stored === "light" || stored === "dark") {
          document.documentElement.classList.toggle("dark", stored === "dark");
        } else if (system === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body class="font-body antialiased bg-[var(--color-bg)] text-[var(--color-text)]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
